name: V6.2 fail-fast probe

on:
  push:
    branches:
      - agent/v6-2-candidate-readiness

jobs:
  failfast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML
      - name: First failing unittest only
        run: python -m unittest discover -s tests -q -f
